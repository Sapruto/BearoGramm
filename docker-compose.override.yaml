services:
  backend:
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - backend_static:/app/static
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      ENV: development

  frontend:
    ports:
      - "5173:80"