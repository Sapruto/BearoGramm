[alembic]
script_location = src/core/migrations

prepend_sys_path = .
version_path_separator = os

file_template = %%(year)d_%%(month)_%%(day)d_%%(hour)_%%(minute)_%%(second)_%%(slug)s

template = src/core/migrations/migration_template.py

timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S